services:
  - type: web
    name: smart-civic-issue-reporting-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: ALEMBIC_DATABASE_URL
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: CORS_ORIGINS
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_SECRET_KEY
        sync: false

      - key: SUPABASE_STORAGE_BUCKET
        value: issue-images